apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  sources:
    - repoURL: https://github.com/nguyentin05/nexus-gitops.git
      targetRevision: production
      path: platform/envoy-gateway/manifests
    - repoURL: https://github.com/nguyentin05/nexus-gitops.git
      targetRevision: production
      path: envs/prod/aws/ap-southeast-1/platform/envoy-gateway/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
