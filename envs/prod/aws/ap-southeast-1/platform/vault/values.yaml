server:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::863547508328:role/prod-vault-irsa
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi

  dataStorage:
    size: 20Gi
    storageClass: gp2

  ha:
    replicas: 3
    raft:
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"

          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname          = true
        }

        storage "raft" {
          path = "/vault/data"
        }

        seal "awskms" {
          region     = "ap-southeast-1"
          kms_key_id = "alias/prod-vault-unseal"
        }

        service_registration "kubernetes" {}
