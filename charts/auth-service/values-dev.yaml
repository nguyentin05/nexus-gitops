replicaCount: 1
image:
  repository: 065320271480.dkr.ecr.ap-southeast-1.amazonaws.com/nexus-auth-service
  tag: v0.2.1
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
nodeSelector:
  intent: apps
env:
  - name: AWS_REGION
    value: ap-southeast-1
envFrom:
  - secretRef:
      name: auth-service-secrets
      optional: true
serviceAccount:
  create: true
  name: ""
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::065320271480:role/dev-auth-service-irsa
telemetry:
  environment: dev
  tracesSamplerArg: "1.0"
