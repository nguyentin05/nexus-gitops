apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "profile-service.fullname" . }}
  labels:
    {{- include "profile-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: public-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /profile
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "profile-service.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 100
        {{- if .Values.rollout.enabled }}
        - name: {{ include "profile-service.fullname" . }}-canary
          port: {{ .Values.service.port }}
          weight: 0
        {{- end }}
