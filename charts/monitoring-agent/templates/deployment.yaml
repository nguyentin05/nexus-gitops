apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-agent.fullname" . }}
  labels:
    {{- include "monitoring-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "monitoring-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "monitoring-agent.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "monitoring-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitoring-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: AGENT_MODE
              value: {{ .Values.config.mode | quote }}
            - name: AWS_REGION
              value: {{ .Values.config.awsRegion | quote }}
            - name: BEDROCK_MODEL_ID
              value: {{ .Values.config.bedrockModelId | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            - name: LOKI_URL
              value: {{ .Values.config.lokiUrl | quote }}
            - name: TARGET_NAMESPACE
              value: {{ .Values.config.targetNamespace | quote }}
            - name: WATCHED_SERVICES
              value: {{ .Values.config.watchedServices | quote }}
            - name: DISCOVERY_SERVICES
              value: {{ .Values.config.discoveryServices | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.config.pollInterval | quote }}
            - name: INCIDENT_COOLDOWN
              value: {{ .Values.config.incidentCooldown | quote }}
            - name: MAX_BEDROCK_CALLS_PER_HOUR
              value: {{ .Values.config.maxBedrockCallsPerHour | quote }}
            - name: ADAPTIVE_PLAN_MIN_OBSERVATIONS
              value: {{ .Values.config.adaptivePlanMinObservations | quote }}
            - name: ADAPTIVE_PLAN_MIN_SERVICES
              value: {{ .Values.config.adaptivePlanMinServices | quote }}
            - name: ADAPTIVE_PLAN_SHADOW_MATCHES
              value: {{ .Values.config.adaptivePlanShadowMatches | quote }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: monitoring-agent-discord
                  key: DISCORD_WEBHOOK_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
