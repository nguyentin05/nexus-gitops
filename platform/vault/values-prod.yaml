global:
  enabled: true
  tlsDisable: true

injector:
  enabled: false
  replicas: 2
  authPath: auth/kubernetes

server:
  serviceAccount:
    create: true
    name: vault
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_WITH_PROD_VAULT_IRSA_ROLE_ARN
    serviceDiscovery:
      enabled: true

  authDelegator:
    enabled: true

  dataStorage:
    enabled: true
    size: 20Gi

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        seal "awskms" {
          region     = "ap-southeast-1"
          kms_key_id = "REPLACE_WITH_PROD_VAULT_KMS_KEY_ID"
        }

        service_registration "kubernetes" {}
