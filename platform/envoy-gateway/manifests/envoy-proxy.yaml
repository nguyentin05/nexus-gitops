apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: system-node-proxy
  namespace: apps
spec:
  networkPublishing:
    type: ClusterIPService
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: envoy-public-gateway
      envoyDeployment:
        pod:
          nodeSelector:
            role: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule