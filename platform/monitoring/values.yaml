fullnameOverride: monitoring

systemNodeSelector: &systemNodeSelector
  role: system

systemTolerations: &systemTolerations
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoSchedule

alertmanager:
  enabled: true
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-monitoring-alertmanager
    nodeSelector: *systemNodeSelector
    tolerations: *systemTolerations

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  adminPassword: prom-operator
  serviceAccount:
    create: true
    name: monitoring-grafana
  service:
    type: ClusterIP
  ingress:
    enabled: false
  grafana.ini:
    database:
      cache_mode: shared
      wal: true
      query_retries: 10
      transaction_retries: 10
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
    - name: CloudWatch
      uid: cloudwatch
      type: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: ap-southeast-1
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  nodeSelector: *systemNodeSelector
  tolerations: *systemTolerations

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    nodeSelector: *systemNodeSelector
    tolerations: *systemTolerations

additionalPrometheusRulesMap:
  nexus-platform-alerts:
    groups:
      - name: nexus.platform
        rules:
          - alert: NodeHighCpuUsage
            expr: |
              100 * sum by (node) (rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
              / sum by (node) (kube_node_status_allocatable{resource="cpu",unit="core"}) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node CPU usage is above 80%"
              description: "{{ $labels.node }} has sustained CPU usage above 80% for 5 minutes."
          - alert: NodeHighMemoryUsage
            expr: |
              100 * sum by (node) (container_memory_working_set_bytes{container!="",image!=""})
              / sum by (node) (kube_node_status_allocatable{resource="memory",unit="byte"}) > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node memory usage is above 90%"
              description: "{{ $labels.node }} has sustained memory usage above 90% for 5 minutes."
          - alert: NexusServiceHigh5xxRate
            expr: |
              100 * sum by (namespace, job) (rate(nexus_http_requests_total{namespace="apps",status=~"5.."}[5m]))
              / sum by (namespace, job) (rate(nexus_http_requests_total{namespace="apps"}[5m])) > 5
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Service 5xx rate is above 5%"
              description: "{{ $labels.job }} in {{ $labels.namespace }} has a 5xx rate above 5% for 5 minutes."
          - alert: NexusPodFrequentRestarts
            expr: sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace="apps"}[15m])) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Application container restarted more than 3 times"
              description: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted more than 3 times in 15 minutes."

prometheusOperator:
  enabled: true
  nodeSelector: *systemNodeSelector
  tolerations: *systemTolerations
  admissionWebhooks:
    patch:
      nodeSelector: *systemNodeSelector
      tolerations: *systemTolerations

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: true

coreDns:
  enabled: true

kube-state-metrics:
  nodeSelector: *systemNodeSelector
  tolerations: *systemTolerations

nodeExporter:
  enabled: true

prometheus-node-exporter:
  tolerations:
    - operator: Exists
