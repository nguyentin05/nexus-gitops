apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service
  namespace: apps
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: auth-service-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: auth-service/config
