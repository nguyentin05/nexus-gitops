apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-monitoring
    kind: SecretStore
  target:
    name: alertmanager-monitoring-alertmanager
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: discord
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
          receivers:
            - name: discord
              discord_configs:
                - webhook_url: '{{ .DISCORD_WEBHOOK_URL }}'
                  send_resolved: true
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: monitoring/alertmanager
        property: DISCORD_WEBHOOK_URL
