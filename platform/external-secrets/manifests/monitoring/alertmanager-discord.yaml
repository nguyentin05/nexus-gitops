apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-monitoring
    kind: SecretStore
  target:
    name: alertmanager-monitoring-alertmanager
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: 'null'
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: monitoring-agent
                match_re:
                  severity: 'warning|critical'
                group_by: [alertname, namespace, service]
                group_wait: 5s
                group_interval: 30s
                continue: true
              - receiver: discord
                match_re:
                  severity: 'warning|critical'
          receivers:
            - name: 'null'
            - name: monitoring-agent
              webhook_configs:
                - url: http://monitoring-agent.monitoring.svc.cluster.local:8080/alerts
                  send_resolved: true
                  http_config:
                    authorization:
                      type: Bearer
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: discord
              discord_configs:
                - webhook_url: '{{ .DISCORD_WEBHOOK_URL }}'
                  send_resolved: true
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: monitoring/alertmanager
        property: DISCORD_WEBHOOK_URL
