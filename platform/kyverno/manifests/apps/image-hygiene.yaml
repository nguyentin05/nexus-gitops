apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: apps-image-hygiene
spec:
  admission: true
  validationFailureAction: Audit
  background: true
  emitWarning: false
  rules:
    - name: require-image-tag
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - apps
      validate:
        allowExistingViolations: true
        message: App container images must use explicit tags.
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: disallow-latest-tag
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - apps
      validate:
        allowExistingViolations: true
        message: App container images must not use the mutable latest tag.
        pattern:
          spec:
            containers:
              - image: "!*:latest"
