name: Promote to production

on:
  workflow_call:
    inputs:
      service_matrix:
        description: Services that passed development validation
        required: true
        type: string
      source_revision:
        description: GitOps revision validated in development
        required: true
        type: string
  workflow_dispatch:
    inputs:
      service:
        description: Service to promote
        required: false
        default: all
        type: choice
        options:
          - all
          - auth-service
          - profile-service

jobs:
  promote:
    name: Promote ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: production-promotion-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(
          inputs.service_matrix ||
          (inputs.service == 'auth-service' && '{"include":[{"service":"auth-service"}]}' ||
           inputs.service == 'profile-service' && '{"include":[{"service":"profile-service"}]}' ||
           '{"include":[{"service":"auth-service"},{"service":"profile-service"}]}')
        ) }}
    env:
      GH_TOKEN: ${{ secrets.NEXUS_CICD_BOT_TOKEN }}
      SERVICE: ${{ matrix.service }}
      SOURCE_REVISION: ${{ inputs.source_revision || github.sha }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
          persist-credentials: false

      - name: Read validated image tag
        id: image
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq '.image.tag' source/charts/${{ matrix.service }}/values-dev.yaml

      - name: Checkout production
        uses: actions/checkout@v7.0.1
        with:
          ref: production
          path: promotion
          fetch-depth: 0
          token: ${{ secrets.NEXUS_CICD_BOT_TOKEN }}

      - name: Prepare promotion branch
        id: branch
        working-directory: promotion
        run: |
          set -euo pipefail
          branch="bot/promote-$SERVICE"
          git fetch origin
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch --track -c "$branch" "origin/$branch"
            git merge --no-edit origin/production
          else
            git switch -c "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Update production image tag
        uses: mikefarah/yq@v4.53.6
        env:
          IMAGE_TAG: ${{ steps.image.outputs.result }}
        with:
          cmd: yq -i '.image.tag = strenv(IMAGE_TAG)' promotion/charts/${{ matrix.service }}/values-prod.yaml

      - name: Push promotion update
        id: update
        working-directory: promotion
        env:
          BOT_EMAIL: ${{ secrets.NEXUS_CICD_BOT_EMAIL }}
          IMAGE_TAG: ${{ steps.image.outputs.result }}
          PROMOTION_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          changed=false
          if ! git diff --quiet; then
            git config user.name "nexus-cicd-bot"
            git config user.email "$BOT_EMAIL"
            git add "charts/$SERVICE/values-prod.yaml"
            git commit -m "chore($SERVICE): promote $IMAGE_TAG to production"
            changed=true
          fi

          if git diff --quiet origin/production -- "charts/$SERVICE/values-prod.yaml"; then
            required=false
          else
            required=true
            git push --set-upstream origin "$PROMOTION_BRANCH"
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Create or update production PR
        if: steps.update.outputs.required == 'true'
        working-directory: promotion
        env:
          IMAGE_TAG: ${{ steps.image.outputs.result }}
          PROMOTION_BRANCH: ${{ steps.branch.outputs.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          CHANGED: ${{ steps.update.outputs.changed }}
        run: |
          set -euo pipefail
          title="chore($SERVICE): promote $IMAGE_TAG to production"
          body="Promotes $SERVICE $IMAGE_TAG after deployment readiness and OWASP ZAP validation of GitOps revision $SOURCE_REVISION.

          @$REPO_OWNER, please review and merge this production promotion manually."
          pr_url="$(gh pr list --base production --head "$PROMOTION_BRANCH" --state open --json url --jq '.[0].url // empty')"

          if [ -z "$pr_url" ]; then
            gh pr create --base production --head "$PROMOTION_BRANCH" --title "$title" --body "$body" --reviewer "$REPO_OWNER"
          else
            gh pr edit "$pr_url" --title "$title" --body "$body"
            if [ "$CHANGED" = true ]; then
              gh pr comment "$pr_url" --body "Updated to the latest validated image: **$IMAGE_TAG**. Previous approval should be reviewed again."
            fi
          fi
