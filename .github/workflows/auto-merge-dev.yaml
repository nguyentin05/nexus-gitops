name: Auto-merge development updates

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

jobs:
  enable-auto-merge:
    name: Enable development auto-merge
    if: startsWith(github.event.pull_request.head.ref, 'chore/update-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.NEXUS_CICD_BOT_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --subject "$PR_TITLE" --body "Automated development manifest update." "$PR_URL"
