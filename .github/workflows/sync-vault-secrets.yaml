name: Sync Vault Secrets

on:
  workflow_dispatch:
    inputs:
      restart_apps:
        description: Restart app deployments after ESO sync
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: dev-capstone-eks
  NEXUS_DB_NAME: nexus
  CLOUDINARY_FOLDER: nexus/avatars

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Config AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: nexus-gitops-sync-vault-secrets
          aws-region: ap-southeast-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ap-southeast-1 --name dev-capstone-eks

      - name: Configure Alertmanager ESO access
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          set -euo pipefail
          kubectl -n vault cp platform/vault/policies/monitoring-alertmanager.hcl vault-0:/tmp/monitoring-alertmanager.hcl
          kubectl -n vault exec vault-0 -- env \
            VAULT_ADDR=http://127.0.0.1:8200 \
            VAULT_TOKEN="$VAULT_TOKEN" \
            sh -ec '
              vault policy write monitoring-alertmanager /tmp/monitoring-alertmanager.hcl
              vault write auth/kubernetes/role/external-secrets-monitoring \
                bound_service_account_names=external-secrets-monitoring \
                bound_service_account_namespaces=monitoring \
                policies=monitoring-alertmanager \
                ttl=1h
            '

      - name: Check required secrets
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          DATABASE_ENDPOINT: ${{ secrets.NEXUS_DB_ENDPOINT }}
          USER_EVENTS_QUEUE_URL: ${{ secrets.USER_EVENTS_QUEUE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          required=(VAULT_TOKEN DATABASE_ENDPOINT USER_EVENTS_QUEUE_URL JWT_SECRET DISCORD_WEBHOOK_URL)

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Copy sync script into pod
        run: |
          kubectl -n vault cp .github/scripts/sync-static-secrets.sh vault-0:/tmp/sync-static-secrets.sh
          kubectl -n vault exec vault-0 -- chmod +x /tmp/sync-static-secrets.sh

      - name: Sync static app secrets
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          DATABASE_ENDPOINT: ${{ secrets.NEXUS_DB_ENDPOINT }}
          USER_EVENTS_QUEUE_URL: ${{ secrets.USER_EVENTS_QUEUE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          kubectl -n vault exec vault-0 -- env \
            VAULT_ADDR=http://127.0.0.1:8200 \
            VAULT_TOKEN="$VAULT_TOKEN" \
            NEXUS_DB_NAME="$NEXUS_DB_NAME" \
            DATABASE_ENDPOINT="$DATABASE_ENDPOINT" \
            USER_EVENTS_QUEUE_URL="$USER_EVENTS_QUEUE_URL" \
            JWT_SECRET="$JWT_SECRET" \
            DISCORD_WEBHOOK_URL="$DISCORD_WEBHOOK_URL" \
            CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME" \
            CLOUDINARY_API_KEY="$CLOUDINARY_API_KEY" \
            CLOUDINARY_API_SECRET="$CLOUDINARY_API_SECRET" \
            CLOUDINARY_FOLDER="$CLOUDINARY_FOLDER" \
            /tmp/sync-static-secrets.sh

      - name: Refresh ESO
        run: |
          kubectl -n apps annotate externalsecret auth-service profile-service force-sync="$(date +%s)" --overwrite
          kubectl -n apps wait externalsecret/auth-service --for=condition=Ready --timeout=180s
          kubectl -n apps wait externalsecret/profile-service --for=condition=Ready --timeout=180s
          kubectl -n monitoring annotate externalsecret alertmanager-discord force-sync="$(date +%s)" --overwrite
          kubectl -n monitoring wait externalsecret/alertmanager-discord --for=condition=Ready --timeout=180s

      - name: Restart apps
        if: ${{ inputs.restart_apps }}
        run: |
          kubectl -n apps rollout restart deployment/auth-service deployment/profile-service
          kubectl -n apps rollout status deployment/auth-service --timeout=180s
          kubectl -n apps rollout status deployment/profile-service --timeout=180s
