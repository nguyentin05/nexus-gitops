name: Sync Vault Secrets

on:
  workflow_dispatch:
    inputs:
      bootstrap_database:
        description: Configure Vault database engine and dynamic DB roles
        required: true
        default: true
        type: boolean
      restart_apps:
        description: Restart app deployments after ESO sync
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: dev-capstone-eks
  NEXUS_DB_NAME: nexus
  CLOUDINARY_FOLDER: nexus/avatars

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: nexus-gitops-sync-vault-secrets
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Check required secrets
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          DATABASE_ENDPOINT: ${{ secrets.NEXUS_DB_ENDPOINT }}
          USER_EVENTS_QUEUE_URL: ${{ secrets.USER_EVENTS_QUEUE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXUS_DB_ADMIN_USERNAME: ${{ secrets.NEXUS_DB_ADMIN_USERNAME }}
          NEXUS_DB_ADMIN_PASSWORD: ${{ secrets.NEXUS_DB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          required=(VAULT_TOKEN DATABASE_ENDPOINT USER_EVENTS_QUEUE_URL JWT_SECRET)
          if [ "${{ inputs.bootstrap_database }}" = "true" ]; then
            required+=(NEXUS_DB_ADMIN_USERNAME NEXUS_DB_ADMIN_PASSWORD)
          fi

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Copy Vault config into pod
        run: |
          kubectl -n vault cp vault-config/policies vault-0:/tmp/policies
          kubectl -n vault cp vault-config/scripts vault-0:/tmp/scripts
          kubectl -n vault exec vault-0 -- chmod +x /tmp/scripts/bootstrap.sh /tmp/scripts/sync-static-secrets.sh

      - name: Bootstrap Vault database engine
        if: ${{ inputs.bootstrap_database }}
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          DATABASE_ENDPOINT: ${{ secrets.NEXUS_DB_ENDPOINT }}
          NEXUS_DB_ADMIN_USERNAME: ${{ secrets.NEXUS_DB_ADMIN_USERNAME }}
          NEXUS_DB_ADMIN_PASSWORD: ${{ secrets.NEXUS_DB_ADMIN_PASSWORD }}
        run: |
          kubectl -n vault exec vault-0 -- env \
            VAULT_ADDR=http://127.0.0.1:8200 \
            VAULT_TOKEN="$VAULT_TOKEN" \
            VAULT_POLICY_DIR=/tmp/policies \
            NEXUS_DB_NAME="$NEXUS_DB_NAME" \
            NEXUS_DB_ADMIN_USERNAME="$NEXUS_DB_ADMIN_USERNAME" \
            NEXUS_DB_ADMIN_PASSWORD="$NEXUS_DB_ADMIN_PASSWORD" \
            NEXUS_DB_CONNECTION_URL="postgresql://{{username}}:{{password}}@$DATABASE_ENDPOINT/$NEXUS_DB_NAME?sslmode=require" \
            /tmp/scripts/bootstrap.sh

      - name: Sync static app secrets
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          DATABASE_ENDPOINT: ${{ secrets.NEXUS_DB_ENDPOINT }}
          USER_EVENTS_QUEUE_URL: ${{ secrets.USER_EVENTS_QUEUE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          kubectl -n vault exec vault-0 -- env \
            VAULT_ADDR=http://127.0.0.1:8200 \
            VAULT_TOKEN="$VAULT_TOKEN" \
            NEXUS_DB_NAME="$NEXUS_DB_NAME" \
            DATABASE_ENDPOINT="$DATABASE_ENDPOINT" \
            USER_EVENTS_QUEUE_URL="$USER_EVENTS_QUEUE_URL" \
            JWT_SECRET="$JWT_SECRET" \
            CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME" \
            CLOUDINARY_API_KEY="$CLOUDINARY_API_KEY" \
            CLOUDINARY_API_SECRET="$CLOUDINARY_API_SECRET" \
            CLOUDINARY_FOLDER="$CLOUDINARY_FOLDER" \
            /tmp/scripts/sync-static-secrets.sh

      - name: Refresh ESO
        run: |
          kubectl -n apps annotate externalsecret auth-service profile-service force-sync="$(date +%s)" --overwrite
          kubectl -n apps wait externalsecret/auth-service --for=condition=Ready --timeout=180s
          kubectl -n apps wait externalsecret/profile-service --for=condition=Ready --timeout=180s

      - name: Restart apps
        if: ${{ inputs.restart_apps }}
        run: |
          kubectl -n apps rollout restart deployment/auth-service deployment/profile-service
          kubectl -n apps rollout status deployment/auth-service --timeout=180s
          kubectl -n apps rollout status deployment/profile-service --timeout=180s
