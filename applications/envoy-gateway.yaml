apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.8.1
      helm:
        releaseName: eg
        valueFiles:
          - $values/platform/envoy-gateway/values.yaml
    - repoURL: https://github.com/nguyentin05/nexus-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
